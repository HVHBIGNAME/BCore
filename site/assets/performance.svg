<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-labelledby="title desc">
<title id="title">Measured NOISE kernel throughput: BCore versus Vanilla</title>
<desc id="desc">Vanilla 26.1, 1 workers: 66.2 chunks/second; BCore, 1 workers: 12.1 chunks/second; Vanilla 26.1, 2 workers: 76.2 chunks/second; BCore, 2 workers: 16.2 chunks/second; Vanilla 26.1, 4 workers: 202.8 chunks/second; BCore, 4 workers: 44.1 chunks/second. Timed contract noise-fill-wg-v2. This is not a full-server benchmark.</desc>
