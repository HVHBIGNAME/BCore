<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="576" viewBox="0 0 1000 576" role="img" aria-labelledby="title desc">
<title id="title">Measured NOISE kernel throughput: BCore versus Vanilla</title>
<desc id="desc">Vanilla 26.1, 1 workers: 49.2 chunks/second; BCore, 1 workers: 2.6 chunks/second; Vanilla 26.1, 2 workers: 85.2 chunks/second; BCore, 2 workers: 3.7 chunks/second; Vanilla 26.1, 4 workers: 168.5 chunks/second; BCore, 4 workers: 5.8 chunks/second. This is not a full-server benchmark.</desc>
