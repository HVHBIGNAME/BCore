<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-labelledby="title desc">
<title id="title">Measured NOISE kernel throughput: BCore versus Vanilla</title>
<desc id="desc">Vanilla 26.1, 1 workers: 44.2 chunks/second; BCore, 1 workers: 39.6 chunks/second; Vanilla 26.1, 2 workers: 88.4 chunks/second; BCore, 2 workers: 71.1 chunks/second; Vanilla 26.1, 4 workers: 198.4 chunks/second; BCore, 4 workers: 140.0 chunks/second. Timed contract noise-fill-wg-v2. This is not a full-server benchmark.</desc>
<defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32,0 H0 V32" fill="none" stroke="#547294" stroke-opacity=".12"/></pattern></defs>
