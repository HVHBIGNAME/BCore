<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-labelledby="title desc">
<title id="title">Measured NOISE kernel throughput: BCore versus Vanilla</title>
<desc id="desc">Vanilla 26.2, 1 workers: 49.8 chunks/second; BCore, 1 workers: 47.8 chunks/second; Vanilla 26.2, 2 workers: 74.0 chunks/second; BCore, 2 workers: 84.0 chunks/second; Vanilla 26.2, 4 workers: 215.4 chunks/second; BCore, 4 workers: 156.8 chunks/second. Timed contract noise-fill-wg-v2. This is not a full-server benchmark.</desc>
